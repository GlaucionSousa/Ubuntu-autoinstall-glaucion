#cloud-config
autoinstall:
  version: 1
  identity:
    hostname: ubuntu-desktop
    username: glaucion
    realname: "Glaucion Sousa"
    password: "$6$8e4ep2Kll31AoIaE$zDgeHI/c4tyIGtKxD1fyk8btXivOlRd7icPcDrcK2ECx.HwHal51v7Lmi4OYml4sEAPC1Ekd7RmIe7TPErJev0"
  locale: pt_BR.UTF-8
  keyboard:
    layout: br
  timezone: America/Recife
  ssh:
    install-server: true
    authorized-keys:
      - "ssh-ed25519 SUA_CHAVE_SSH_AQUI"
  packages:
    - curl
    - wget
    - vim
    - git
    - htop
    - tmux
    - unzip
    - build-essential
    - net-tools
    - nmap
    - iperf3
    - traceroute
    - mtr
    - bridge-utils
    - vlan
    - wireshark
    - tcpdump
    - openssh-server
    - python3-pip
    - virtualbox
    - gparted
    - flameshot
    - openvpn
    - wireguard
    - docker.io
    - docker-compose
    - qemu-kvm
    - libvirt-daemon-system
    - libvirt-clients
    - virt-manager
    - nodejs
    - npm
    - kitty
  snaps:
    - name: spotify
      channel: stable
      classic: false
  codecs:
    install: true
  drivers:
    install: true
  updates: all

  late-commands:
    # Logs de pós-instalação
    - "echo '### Pós-instalação iniciada' > /target/root/pos-inst.log || true"

    # Atualização geral
    - curtin in-target --target=/target apt update || true
    - curtin in-target --target=/target apt -y upgrade || true

    # Adiciona usuário a grupos
    - curtin in-target --target=/target usermod -aG wireshark,docker $AUTOINSTALL_USERNAME || true

    # Ativar TRIM SSD
    - curtin in-target --target=/target systemctl enable fstrim.timer || true

    # Google Chrome
    - curtin in-target --target=/target bash -c "wget -qO /usr/share/keyrings/google-linux-signing-key.gpg https://dl.google.com/linux/linux_signing_key.pub || true"
    - curtin in-target --target=/target bash -c "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-key.gpg] http://dl.google.com/linux/chrome/deb/ stable main' > /etc/apt/sources.list.d/google-chrome.list || true"
    - curtin in-target --target=/target apt update || true
    - curtin in-target --target=/target apt install -y google-chrome-stable || true

    # VS Code
    - curtin in-target --target=/target bash -c "wget -qO /usr/share/keyrings/vscode-archive-keyring.gpg https://packages.microsoft.com/keys/microsoft.asc || true"
    - curtin in-target --target=/target bash -c "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/vscode-archive-keyring.gpg] https://packages.microsoft.com/repos/code stable main' > /etc/apt/sources.list.d/vscode.list || true"
    - curtin in-target --target=/target apt update || true
    - curtin in-target --target=/target apt install -y code || true

    # DevOps: Ansible + Terraform
    - curtin in-target --target=/target apt install -y ansible || true
    - curtin in-target --target=/target bash -c "wget -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.7.7/terraform_1.7.7_linux_amd64.zip && unzip /tmp/terraform.zip -d /usr/local/bin" || true

    # KVM, bridges e libvirt
    - curtin in-target --target=/target systemctl enable libvirtd || true
    - curtin in-target --target=/target bash -c "virsh net-start default || true && virsh net-autostart default || true" 

    # Instala todos os pacotes .deb da pasta extras/
    - curtin in-target --target=/target bash -c "for pkg in /cdrom/extras/*.deb; do dpkg -i \$pkg || true; done"

    # Criação de workspace
    - curtin in-target --target=/target mkdir -p /home/$AUTOINSTALL_USERNAME/Workspace || true

    # Reinicia após instalação
    shutdown: reboot

